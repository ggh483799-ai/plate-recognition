name: Deploy plate-recognition to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 支持手动触发

concurrency:
  group: deploy-plate-recognition
  cancel-in-progress: false   # 部署不并发、不取消，排队执行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/plate-recognition
            echo "[INFO] git pull: $(date '+%F %T')"
            ok=0
            for i in 1 2 3; do
              if git pull origin main; then ok=1; break; fi
              echo "[WARN] git pull 第 ${i} 次失败，10s 后重试"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then echo "[ERROR] git pull 连续 3 次失败"; exit 1; fi
            echo "[INFO] docker compose up -d --build"
            # compose 文件在仓库 docker/ 子目录（build context 用 .. 指回仓库根）
            sudo docker compose -f /opt/plate-recognition/docker/docker-compose.yml up -d --build
            echo "[INFO] 等待服务就绪..."
            sleep 15

      - name: Health check (on server)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            fail=0
            # 服务启动要加载 torch + YOLO + hyperlpr（首启还要下载模型，~40-90s），
            # 固定 sleep 15 会过早误判——这里就绪重试最多 3 分钟。
            # 注意：set -e 下 curl 网络失败（exit 56）会直接杀脚本，必须 || true 兜住
            code="000"
            # 36 轮 × 10s = 6 分钟：首次部署要下载兜底引擎模型（12MB，境外模型站约 40KB/s），
            # 挂 volume 后只有第一次会慢；之后的部署都是秒起。
            for i in $(seq 1 36); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     "http://127.0.0.1:8030/health" || true)
              if [ -z "$code" ]; then code="000"; fi
              echo "HEALTH 第 $i 次 -> $code"
              if [ "$code" = "200" ]; then break; fi
              sleep 10
            done
            if [ "$code" != "200" ]; then fail=1; fi

            # 功能冒烟：healthz 测不出系统库缺失 / 模型文件缺失，必须在容器内真跑一次核心链路
            # python tools/smoke_test.py 是「完整命令」，自带引号，不要在外面再套一层引号（会引号冲突）
            #   推荐：命令写进仓库脚本，这里只调用 →  sudo docker exec plate-recognition python smoke_test.py
            #   内联：只能自带一层引号        →  sudo docker exec plate-recognition python -c "import fitz; print('OK')"
            if sudo docker exec plate-recognition python tools/smoke_test.py; then
              echo "[INFO] 功能冒烟通过"
            else
              echo "[ERROR] 功能冒烟失败"
              fail=1
            fi

            echo "[INFO] 容器状态："
            sudo docker compose -f /opt/plate-recognition/docker/docker-compose.yml ps
            if [ "$fail" -ne 0 ]; then echo "[ERROR] 健康检查未全部通过"; exit 1; fi
            echo "[INFO] 全部健康检查通过，部署完成"
